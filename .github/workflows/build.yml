name: Compilar candidato 3.1.1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Compilar, auditar dependencias y probar
        run: ./scripts/Build-SignPathCandidate.ps1 -OutputDirectory "$env:RUNNER_TEMP/candidate-311"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-candidate-3.1.1
          path: ${{ runner.temp }}/candidate-311/MINSEG-Control.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-evidence-3.1.1
          path: ${{ runner.temp }}/candidate-311-evidence/**
          if-no-files-found: error
          retention-days: 30
